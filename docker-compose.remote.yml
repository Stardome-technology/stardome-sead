# Remote compose file — pulls pre-built images from ghcr.io instead of building.
# Usage: docker compose -f docker-compose.remote.yml up -d
#
# Go Gateway migration (phase 4.4): the C++ services (sead-core, edge-service,
# storage-gateway, source-data-service, sead-sync) are gRPC-only and publish no
# public HTTP ports. The Go gateway is the single public HTTPS entry point: it
# terminates TLS, enforces auth, and routes to the internal services over the
# shared `sead-network` bridge. `auth-service` and `verifier-service` are
# collapsed into the gateway (no longer standalone services).

services:
  sead-core:
    image: ghcr.io/stardome-technology/stardome-sead/sead-core:latest
    # No public ports — gRPC-only, reachable on sead-network via the gateway
    volumes:
      - sead_data:/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SERVICE_NAME=sead-core
    command: ["sead-core", "--port", "50051", "--db", "/data/sead.db"]
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sead-network

  edge-service:
    image: ghcr.io/stardome-technology/stardome-sead/edge-service:latest
    # No public ports — gRPC-only, reachable on sead-network via the gateway
    volumes:
      - sead_data:/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SERVICE_NAME=edge-service
      - EDGE_ORG_ID=${EDGE_ORG_ID:?error}
      - EDGE_ID=${EDGE_ID:?error}
      - EDGE_SIGNING_KEY=${EDGE_SIGNING_KEY:-}
      - EDGE_ORG_SIGNING_KEY=${EDGE_ORG_SIGNING_KEY:-}
      - EDGE_ORG_PUBLIC_KEY=${EDGE_ORG_PUBLIC_KEY:-}
      - EDGE_TOKEN_TTL=${EDGE_TOKEN_TTL:-300}
      - EDGE_STORAGE_GATEWAY_URL=${EDGE_STORAGE_GATEWAY_URL:-storage-gateway:50052}
      - EDGE_WATCHDOG_INTERVAL_SEC=${EDGE_WATCHDOG_INTERVAL_SEC:-30}
      - EDGE_COMMIT_STRATEGY=${EDGE_COMMIT_STRATEGY:-single}
      - EDGE_BATCH_FLUSH_INTERVAL_SEC=${EDGE_BATCH_FLUSH_INTERVAL_SEC:-300}
      - EDGE_AUTHORIZATION_EVENT_ID=${EDGE_AUTHORIZATION_EVENT_ID:-}
    command: ["edge-service", "--port", "50055", "--db", "/data/edge.db",
              "--org-id", "${EDGE_ORG_ID:?error}",
              "--edge-id", "${EDGE_ID:?error}",
              "--signing-key", "${EDGE_SIGNING_KEY}",
              "--org-signing-key", "${EDGE_ORG_SIGNING_KEY}",
              "--org-public-key", "${EDGE_ORG_PUBLIC_KEY}",
              "--token-ttl", "${EDGE_TOKEN_TTL:-300}",
              "--storage-gateway-url", "${EDGE_STORAGE_GATEWAY_URL:-storage-gateway:50052}",
              "--sead-core-url", "sead-core:50051",
              "--watchdog-interval", "${EDGE_WATCHDOG_INTERVAL_SEC:-30}",
              "--commit-strategy", "${EDGE_COMMIT_STRATEGY:-single}",
              "--batch-flush-interval", "${EDGE_BATCH_FLUSH_INTERVAL_SEC:-300}",
              "--edge-authorization-event-id", "${EDGE_AUTHORIZATION_EVENT_ID}"]
    depends_on:
      sead-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50055"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sead-network

  storage-gateway:
    image: ghcr.io/stardome-technology/stardome-sead/storage-gateway:latest
    # No public ports — gRPC-only, reachable on sead-network via the gateway
    volumes:
      - sead_data:/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SERVICE_NAME=storage-gateway
      - IPFS_API_BASE_URL=${IPFS_API_BASE_URL:-https://ipfs.stardome.cloud}
    command: ["storage-gateway", "--port", "50052", "--db", "/data/storage.db",
              "--ipfs-url", "${IPFS_API_BASE_URL:-https://ipfs.stardome.cloud}"]
    depends_on:
      sead-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50052"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sead-network

  source-data-service:
    image: ghcr.io/stardome-technology/stardome-sead/source-data-service:latest
    # No public ports — gRPC-only, reachable on sead-network via the gateway
    volumes:
      - sead_data:/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SERVICE_NAME=source-data-service
      - SOURCE_DATA_TRUSTED_VERIFIERS=${SOURCE_DATA_TRUSTED_VERIFIERS:-}
    command: ["source-data-service", "--port", "50053", "--db", "/data/sourcedata.db",
              "--trusted-verifiers", "${SOURCE_DATA_TRUSTED_VERIFIERS:-}"]
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50053"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sead-network

  sead-sync:
    image: ghcr.io/stardome-technology/stardome-sead/sead-sync:latest
    # No public ports — gRPC-only, reachable on sead-network via the gateway
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SERVICE_NAME=sead-sync
      - SYNC_ORG_ID=${SYNC_ORG_ID:?error}
      - SYNC_P2P_URL=${SYNC_P2P_URL:-http://p2p:30089}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-10}
      - SYNC_OBSERVE_ORGS=${SYNC_OBSERVE_ORGS:-}
    command: ["/bin/sh", "-c",
              "ARGS=\"--gateway-url gateway:50054 --p2p-url ${SYNC_P2P_URL:-http://p2p:30089} --org-id ${SYNC_ORG_ID:?error} --sync-interval ${SYNC_INTERVAL:-10}\"; \
               for o in $(echo ${SYNC_OBSERVE_ORGS} | tr ',' ' '); do \
                 [ -n \"$$o\" ] && ARGS=\"$$ARGS --observe-org $$o\"; \
               done; \
               exec sead-sync $$ARGS"]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=gateway:50054"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sead-network

  gateway:
    image: ghcr.io/stardome-technology/stardome-sead-gateway:latest
    ports:
      - "30080:30080"
    environment:
      - GATEWAY_LISTEN_ADDR=${GATEWAY_LISTEN_ADDR:-:30080}
      - GATEWAY_TLS_ENABLED=${GATEWAY_TLS_ENABLED:-false}
      - GATEWAY_TLS_CERT=${GATEWAY_TLS_CERT:-}
      - GATEWAY_TLS_KEY=${GATEWAY_TLS_KEY:-}
      - GATEWAY_AUTH_ENABLED=${GATEWAY_AUTH_ENABLED:-true}
      - GATEWAY_AUTH_SECRET=${GATEWAY_AUTH_SECRET:-}
      - GATEWAY_EDGE_TOKENS=${GATEWAY_EDGE_TOKENS:-}
      - GATEWAY_AUTH_CBOR_ENABLED=${GATEWAY_AUTH_CBOR_ENABLED:-true}
      - GATEWAY_AUTH_CBOR_SEAD_CORE_URL=${GATEWAY_AUTH_CBOR_SEAD_CORE_URL:-http://sead-core:50051}
      - GATEWAY_AUTH_CBOR_CACHE_TTL=${GATEWAY_AUTH_CBOR_CACHE_TTL:-60}
      - GATEWAY_AUTH_CBOR_SKEW_TOLERANCE=${GATEWAY_AUTH_CBOR_SKEW_TOLERANCE:-30}
      - GATEWAY_METRICS_ENABLED=${GATEWAY_METRICS_ENABLED:-true}
      - GATEWAY_LOG_LEVEL=${GATEWAY_LOG_LEVEL:-info}
      - GATEWAY_READ_TIMEOUT=${GATEWAY_READ_TIMEOUT:-30s}
      - GATEWAY_WRITE_TIMEOUT=${GATEWAY_WRITE_TIMEOUT:-30s}
      - GATEWAY_IDLE_TIMEOUT=${GATEWAY_IDLE_TIMEOUT:-90s}
      - GATEWAY_PROXY_TIMEOUT=${GATEWAY_PROXY_TIMEOUT:-30s}
      - GATEWAY_HEALTH_BACKENDS=${GATEWAY_HEALTH_BACKENDS:-sead-core,edge-service,storage,source-data}
      # Internal C++ services (gRPC-only, Go Gateway migration phase 4.4)
      - SVC_SEAD_CORE_GRPC=${SVC_SEAD_CORE_GRPC:-sead-core:50051}
      - SVC_EDGE_SERVICE_GRPC=${SVC_EDGE_SERVICE_GRPC:-edge-service:50055}
      - SVC_STORAGE_GRPC=${SVC_STORAGE_GRPC:-storage-gateway:50052}
      - SVC_SOURCE_DATA_GRPC=${SVC_SOURCE_DATA_GRPC:-source-data-service:50053}
      - GATEWAY_GRPC_PORT=${GATEWAY_GRPC_PORT:-50054}
    depends_on:
      sead-core:
        condition: service_healthy
      edge-service:
        condition: service_healthy
      storage-gateway:
        condition: service_healthy
      source-data-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:30080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - sead-network

volumes:
  sead_data:

networks:
  sead-network:
    name: sead-network
    driver: bridge