# Production overlay for compose.yaml: runs the pre-built images from ghcr.io.
# Usage:
#   docker compose -f compose.yaml -f compose.production.yaml pull
#   docker compose -f compose.yaml -f compose.production.yaml up -d
#
# edge-service signs with real XMSS keys and relies on the key indices stored in
# `edge.db` (see the README, "XMSS key-state persistence").
#
# Hardening (see the README, "Container hardening"): every service drops all
# Linux capabilities and adds none back, can't gain privileges, and runs on a
# read-only root filesystem with a `/tmp` tmpfs. gossip-node and the gateway
# also get a `/run` tmpfs. Each service writes only to its volumes: SQLite's
# `-wal` and `-shm` files stay next to their databases in `/data`, never on a
# tmpfs.
#
# Limits: every service gets 256 MiB of memory, half a CPU and 256 processes;
# edge-service gets 512 MiB. They are sized for 1-vCPU, 2 GiB hosts; raise them
# in proportion on larger hosts.
#
# Network exposure (see docs/setup-vps.md, "Network exposure"): gossip-node runs
# with mDNS off and the DHT on, and the gateway verifies its peer gateways' TLS
# certificates. These are literal values, not `.env` variables, so a node can't
# carry the development settings into production. CI fails the build unless
# they hold and the only published ports are 30080 and 31002.

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  read_only: true
  mem_limit: 256m
  cpus: "0.5"
  pids_limit: 256

services:
  sead-core:
    image: ghcr.io/stardome-technology/stardome-sead/sead-core:0.1.0@sha256:49bf9b7c2b462de6458a3b3d9280414a2a195eb768a17a9ece8b3b269dab0a17
    <<: *hardening
    tmpfs:
      - /tmp

  edge-service:
    image: ghcr.io/stardome-technology/stardome-sead/edge-service:0.1.0@sha256:e76900f78f7e917b2ee5503f8fefdb94b503059f6024db55bcb684460192cb80
    <<: *hardening
    # A larger memory limit: an out-of-memory kill between an XMSS signature
    # and the event's post spends a key index without using it.
    mem_limit: 512m
    # No `/run` tmpfs: Compose mounts the key secrets under /run/secrets/.
    tmpfs:
      - /tmp

  pin-service:
    image: ghcr.io/stardome-technology/stardome-sead/pin-service:0.1.0@sha256:8b9d0fab7e2f441a05126dafa0b3c9364177e237d46ff49a3c71ad26586263f6
    <<: *hardening
    # No `user:`: from v0.1.0 the image runs as 10001:10001, like every other
    # service, and writes its CID-tracker SQLite DB into its own `pin_data`
    # volume, which must belong to that user. A node set up with
    # older images runs scripts/migrate-sead-ownership.sh once, with the stack
    # stopped, when it switches to v0.1.0 (see the README, "Moving a node to
    # the v0.1.0 user").
    tmpfs:
      - /tmp

  source-data-service:
    image: ghcr.io/stardome-technology/stardome-sead/source-data-service:0.1.0@sha256:777bbca612ab93183b7d8219041530ee68d344dec0632f5b6ee7f24f422c4d6b
    <<: *hardening
    tmpfs:
      - /tmp

  gossip-node:
    image: ghcr.io/stardome-technology/stardome-sead/gossip-node:0.1.0@sha256:8d33f556a3d7ec29ce033b379650be86149eaf91a832087010de652395d39865
    <<: *hardening
    # No `user:`: from v0.1.0 the image runs as 10001:10001, so its identity
    # key on the host, mounted from GOSSIP_IDENTITY_DIR at /data/gossip-keys,
    # must belong to 10001 at mode 0600. Older images run as root and need
    # the key owned root:root. With capabilities dropped, root can't read a
    # key it doesn't own either: gossip-node exits at start and crash-loops.
    tmpfs:
      - /tmp
      - /run
    environment:
      # mDNS is link-local multicast: on a Docker bridge it finds no peer
      # across the Internet, so production relies on GOSSIP_BOOTSTRAP and the
      # DHT. The DHT stays on: it bootstraps only from GOSSIP_BOOTSTRAP, so it
      # discovers peers within the SEAD mesh, not on the public IPFS DHT.
      GOSSIP_MDNS: "false"
      GOSSIP_DHT: "true"

  gateway:
    image: ghcr.io/stardome-technology/stardome-sead-gateway:0.1.0@sha256:5f9046952a2f3c7bd789996ef8c473659d53973447da099111a4b66ce185414f
    <<: *hardening
    tmpfs:
      - /tmp
      - /run
    environment:
      # Verify peer gateways' certificates: use public certificates, or set
      # GATEWAY_PEER_CA_CERT for peers on a private CA.
      GATEWAY_PEER_TLS_INSECURE: "false"
