# Base Compose file for a SEAD node. It is never used alone: combine it with
# exactly one overlay.
#
#   Production (pre-built images from ghcr.io):
#     docker compose -f compose.yaml -f compose.production.yaml up -d
#   Development (local builds, debug logs, gRPC ports on localhost):
#     docker compose -f compose.yaml -f compose.development.yaml up -d
#
# `.env.example` sets COMPOSE_FILE to the production pair, so with it copied to
# `.env` a plain `docker compose up -d` in this directory uses production.
#
# Required variables use `${VAR:?}`: with one unset or empty, `docker compose`
# stops before doing anything and names it.
#
# The project name is pinned to `stardome-sead`, the name Compose derived from
# the clone's directory before this file existed. Changing it orphans the
# `stardome-sead_sead_data` volume, which holds the XMSS key indices in
# `edge.db`: a new volume resets them and forces a key rotation.
#
# Go Gateway migration (phase 4.4): the C++ services (sead-core, edge-service,
# pin-service, source-data-service, sead-sync) are gRPC-only and publish no
# public HTTP ports. The Go gateway is the single public HTTPS entry point: it
# terminates TLS, enforces auth, and routes to the internal services over the
# shared `sead-network` bridge. `auth-service` and `verifier-service` are
# collapsed into the gateway (no longer standalone services). pin-service is the
# sole storage authority (AddToIPFS/RetrieveFromIPFS/ResolveCIDByPayloadHash).

name: stardome-sead

services:
  sead-core:
    restart: unless-stopped
    # No public ports — gRPC-only, reachable on sead-network via the gateway
    volumes:
      - sead_data:/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SERVICE_NAME=sead-core
    command: ["sead-core", "--port", "50051", "--db", "/data/sead.db"]
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sead-network

  edge-service:
    # No public ports — gRPC-only, reachable on sead-network via the gateway
    volumes:
      - sead_data:/data
    # The three keys come from host files as Compose secrets (top-level
    # `secrets:` below), mounted under /run/secrets/ and passed by path, so no
    # key appears in the container's command, arguments or environment.
    secrets:
      - edge_signing_key
      - org_signing_key
      - org_public_key
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SERVICE_NAME=edge-service
      # ── Identity vars — org key rotation ─────────────────────────────────
      # These are the identity vars consumed by edge-service and gossip-node
      # below. On an org key rotation (docs/org-key-rotation.md) these change:
      #   the files EDGE_ORG_SIGNING_KEY_FILE / EDGE_ORG_PUBLIC_KEY_FILE
      #                          name: new org XMSS keypair
      #   EDGE_ORG_ID            unchanged for a same-org_id rotation; new id
      #                          only in the distinct-org variant
      #   EDGE_ID / the file EDGE_SIGNING_KEY_FILE names  only if the edge key
      #                          is rotated too
      #   GOSSIP_ORG_ID / GOSSIP_OBSERVE_ORGS  same rule as EDGE_ORG_ID
      #   GOSSIP_BOOTSTRAP     unchanged (transport PeerIDs are not org identity)
      # After updating `.env`:
      #   * Recreate the WHOLE stack (`docker compose up -d` from this
      #     directory) — do NOT recreate edge-service alone. gossip-node must
      #     be RECREATED, not merely `restart`ed: `restart` keeps the OLD env,
      #     and a gossip-node left on the old GOSSIP_ORG_ID/GOSSIP_OBSERVE_ORGS
      #     silently stops cross-edge replication of the new org's events with
      #     no error surfaced.
      #   * Stagger gossip recreation across nodes by ~15 s (longer than one
      #     GOSSIP_HEARTBEAT_SEC=10): recreate node A's gossip-node, wait 15 s,
      #     then node B's — recreating both ends close together leaves the
      #     second dialer stuck in libp2p dial backoff (`topic peers=0`, mesh
      #     silently stops sharing frontiers). Verify `topic peers>0` on both.
      # ──────────────────────────────────────────────────────────────────────
      - EDGE_ORG_ID=${EDGE_ORG_ID:?}
      - EDGE_ID=${EDGE_ID:?}
      - EDGE_TOKEN_TTL=${EDGE_TOKEN_TTL:-300}
      - EDGE_PIN_SERVICE_URL=${EDGE_PIN_SERVICE_URL:-pin-service:50056}
      - EDGE_WATCHDOG_INTERVAL_SEC=${EDGE_WATCHDOG_INTERVAL_SEC:-1}
      - EDGE_PIN_INTERVAL_SEC=${EDGE_PIN_INTERVAL_SEC:-30}
      - EDGE_PIN_MAX_RETRIES=${EDGE_PIN_MAX_RETRIES:--1}
      - EDGE_PIN_BACKOFF_BASE_SEC=${EDGE_PIN_BACKOFF_BASE_SEC:-30}
      - EDGE_PIN_BACKOFF_CAP_SEC=${EDGE_PIN_BACKOFF_CAP_SEC:-86400}
      - EDGE_COMMIT_STRATEGY=${EDGE_COMMIT_STRATEGY:-single}
      - EDGE_BATCH_FLUSH_INTERVAL_SEC=${EDGE_BATCH_FLUSH_INTERVAL_SEC:-300}
      # Optional — auto-resolved from sead-core at startup if unset; set to override
      - EDGE_AUTHORIZATION_EVENT_ID=${EDGE_AUTHORIZATION_EVENT_ID:-}
    command: ["edge-service", "--port", "50055", "--db", "/data/edge.db",
              "--org-id", "${EDGE_ORG_ID:?}",
              "--edge-id", "${EDGE_ID:?}",
              "--signing-key-file", "/run/secrets/edge_signing_key",
              "--org-signing-key-file", "/run/secrets/org_signing_key",
              "--org-public-key-file", "/run/secrets/org_public_key",
              "--token-ttl", "${EDGE_TOKEN_TTL:-300}",
              "--pin-service-url", "${EDGE_PIN_SERVICE_URL:-pin-service:50056}",
              "--sead-core-url", "sead-core:50051",
              "--watchdog-interval", "${EDGE_WATCHDOG_INTERVAL_SEC:-1}",
              "--commit-strategy", "${EDGE_COMMIT_STRATEGY:-single}",
              "--batch-flush-interval", "${EDGE_BATCH_FLUSH_INTERVAL_SEC:-300}",
              "--pin-interval", "${EDGE_PIN_INTERVAL_SEC:-30}",
              "--pin-max-retries", "${EDGE_PIN_MAX_RETRIES:--1}",
              "--pin-backoff-base", "${EDGE_PIN_BACKOFF_BASE_SEC:-30}",
              "--pin-backoff-cap", "${EDGE_PIN_BACKOFF_CAP_SEC:-86400}",
              "--edge-authorization-event-id", "${EDGE_AUTHORIZATION_EVENT_ID:-}"]
    depends_on:
      sead-core:
        condition: service_healthy
      pin-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50055"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sead-network

  pin-service:
    # No public ports — gRPC-only, sole storage authority (AddToIPFS,
    # RetrieveFromIPFS, ResolveCIDByPayloadHash); reachable on sead-network.
    volumes:
      - sead_data:/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SERVICE_NAME=pin-service
      - IPFS_BASE_URL=${IPFS_API_BASE_URL:-https://ipfs.stardome.cloud:443}
      - PIN_SERVICE_DB=${PIN_SERVICE_DB:-/data/pin-service.db}
    command: ["--port", "50056", "--ipfs-url", "${IPFS_API_BASE_URL:-https://ipfs.stardome.cloud:443}",
              "--db", "${PIN_SERVICE_DB:-/data/pin-service.db}"]
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50056"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sead-network

  source-data-service:
    # No public ports — gRPC-only, reachable on sead-network via the gateway
    volumes:
      - sead_data:/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SERVICE_NAME=source-data-service
      - SOURCE_DATA_TRUSTED_VERIFIERS=${SOURCE_DATA_TRUSTED_VERIFIERS:-}
    command: ["source-data-service", "--port", "50053", "--db", "/data/sourcedata.db",
              "--trusted-verifiers", "${SOURCE_DATA_TRUSTED_VERIFIERS:-}"]
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50053"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sead-network

  gossip-node:
    # Option A (C2): own libp2p peer per node.
    # - On the sead-network bridge so it reaches sead-core/gateway by name.
    # - Publish the libp2p TCP port so other POCs reach this peer at the node's
    #   LAN/mesh IP (e.g. /ip4/192.168.60.1/tcp/31002 and mDNS).
    # - Persistent identity key (bind-mounted host file) keeps the PeerId stable
    #   across restarts and `docker compose down -v` so published bootstrap/
    #   catalog multiaddrs stay valid.
    ports:
      - "31002:31002/tcp"
    volumes:
      # Bind-mount the identity key DIRECTORY from host to persist PeerID across
      # restarts and `docker compose down -v`. Mounting a directory (not a file)
      # avoids Docker auto-creating a bind-mount source as a directory when the
      # file doesn't exist yet; gossip-node creates gossip-identity.key inside it.
      #
      # ⚠️ DO NOT change this path (GOSSIP_IDENTITY_DIR). The default
      # `~/.sead/gossip-keys` is resolved relative to the COMPOSE WORKING
      # DIRECTORY (where you run `docker compose`), NOT to $HOME. If you bring
      # the stack up from a different directory (e.g. `cd ~` instead of
      # `cd ~/stardome-sead`), `~` expands to a DIFFERENT host path and
      # gossip-node generates a NEW identity key → the PeerID ROTATES, breaking
      # every published GOSSIP_BOOTSTRAP / catalog multiaddr (peers start
      # failing with "peer id mismatch"). Always `cd` into the same directory
      # before `up -d`, or pin GOSSIP_IDENTITY_DIR to an absolute path.
      - ${GOSSIP_IDENTITY_DIR:-~/.sead/gossip-keys}:/data/gossip-keys
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SERVICE_NAME=gossip-node
      # GOSSIP_ORG_ID / GOSSIP_OBSERVE_ORGS / GOSSIP_BOOTSTRAP are
      # rotation-affected — see the identity comment block in edge-service
      # above and docs/org-key-rotation.md §5–7 (recreate, don't restart;
      # stagger ~15 s across nodes).
      - GOSSIP_ORG_ID=${GOSSIP_ORG_ID:?}
      - GOSSIP_OBSERVE_ORGS=${GOSSIP_OBSERVE_ORGS:-}
      - GOSSIP_LISTEN=${GOSSIP_LISTEN:-/ip4/0.0.0.0/tcp/31002}
      # Externally reachable multiaddr to advertise in place of the container-
      # internal host.Addrs() (e.g. the bat0 mesh IP). Set per POC to
      # /ip4/192.168.60.<n>/tcp/31002 so peers redial a routable address
      # after a mesh flap. Required: an Internet-facing node that advertises
      # its container IP gets "no good addresses" / "dial to self" on every
      # inbound dial.
      - GOSSIP_ADVERTISE=${GOSSIP_ADVERTISE:?}
      - GOSSIP_BOOTSTRAP=${GOSSIP_BOOTSTRAP:-}
      - GOSSIP_HEARTBEAT_SEC=${GOSSIP_HEARTBEAT_SEC:-10}
      - GOSSIP_CORE=${GOSSIP_CORE:-sead-core:50051}
      - GOSSIP_GATEWAY=${GOSSIP_GATEWAY:-gateway:50054}
      - GOSSIP_EDGE=${GOSSIP_EDGE:-edge-service:50055}
      - GOSSIP_MDNS=${GOSSIP_MDNS:-true}
      - GOSSIP_DHT=${GOSSIP_DHT:-true}
      - GOSSIP_PNET=${GOSSIP_PNET:-false}
      - GOSSIP_IDENTITY_KEY_FILE=${GOSSIP_IDENTITY_KEY_FILE:-/data/gossip-keys/gossip-identity.key}
    # Override the image ENTRYPOINT ("gossip-node") so the `command` wrapper below
    # actually runs as a shell script. Without this, compose appends
    # ["sh","-c",...] as positional args to `gossip-node`, Go's flag parser stops
    # at the first non-flag arg ("sh"), and the binary boots with defaults
    # (relay-only + port 9001), never receiving --own-org/--orgs/--listen.
    entrypoint: ["/bin/sh", "-c"]
    command: ["ARGS=\"--own-org ${GOSSIP_ORG_ID:?} --listen ${GOSSIP_LISTEN:-/ip4/0.0.0.0/tcp/31002} --core ${GOSSIP_CORE:-sead-core:50051} --gateway ${GOSSIP_GATEWAY:-gateway:50054} --edge ${GOSSIP_EDGE:-edge-service:50055} --heartbeat ${GOSSIP_HEARTBEAT_SEC:-10} --mdns=${GOSSIP_MDNS:-true} --dht=${GOSSIP_DHT:-true} --identity-key-file ${GOSSIP_IDENTITY_KEY_FILE:-/data/gossip-keys/gossip-identity.key}\"; [ -n \"${GOSSIP_OBSERVE_ORGS:-}\" ] && ARGS=\"$$ARGS --orgs ${GOSSIP_OBSERVE_ORGS:-}\"; [ -n \"${GOSSIP_BOOTSTRAP:-}\" ] && ARGS=\"$$ARGS --bootstrap ${GOSSIP_BOOTSTRAP:-}\"; [ -n \"${GOSSIP_ADVERTISE:?}\" ] && ARGS=\"$$ARGS --advertise ${GOSSIP_ADVERTISE:?}\"; [ \"${GOSSIP_PNET:-false}\" = \"true\" ] && ARGS=\"$$ARGS --pnet\"; exec gossip-node $$ARGS"]
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sead-network

  gateway:
    ports:
      - "30080:30080"
    volumes:
      - ./secrets:/etc/gateway/certs:ro
    environment:
      - GATEWAY_LISTEN_ADDR=${GATEWAY_LISTEN_ADDR:-:30080}
      - GATEWAY_TLS_ENABLED=${GATEWAY_TLS_ENABLED:-true}
      - GATEWAY_TLS_CERT=${GATEWAY_TLS_CERT:-/etc/gateway/certs/server.crt}
      - GATEWAY_TLS_KEY=${GATEWAY_TLS_KEY:-/etc/gateway/certs/server.key}
      - GATEWAY_AUTH_ENABLED=${GATEWAY_AUTH_ENABLED:-true}
      - SEAD_AUTH_SECRET=${SEAD_AUTH_SECRET:?}
      - GATEWAY_EDGE_TOKENS=${GATEWAY_EDGE_TOKENS:-}
      - GATEWAY_AUTH_CBOR_ENABLED=${GATEWAY_AUTH_CBOR_ENABLED:-true}
      # Key resolution uses the SVC_SEAD_CORE_GRPC gRPC target
      - GATEWAY_AUTH_CBOR_CACHE_TTL=${GATEWAY_AUTH_CBOR_CACHE_TTL:-60}
      - GATEWAY_AUTH_CBOR_SKEW_TOLERANCE=${GATEWAY_AUTH_CBOR_SKEW_TOLERANCE:-30}
      - GATEWAY_METRICS_ENABLED=${GATEWAY_METRICS_ENABLED:-true}
      - GATEWAY_LOG_LEVEL=${GATEWAY_LOG_LEVEL:-info}
      - GATEWAY_READ_TIMEOUT=${GATEWAY_READ_TIMEOUT:-30s}
      - GATEWAY_WRITE_TIMEOUT=${GATEWAY_WRITE_TIMEOUT:-30s}
      - GATEWAY_IDLE_TIMEOUT=${GATEWAY_IDLE_TIMEOUT:-90s}
      - GATEWAY_PROXY_TIMEOUT=${GATEWAY_PROXY_TIMEOUT:-30s}
      - GATEWAY_HEALTH_BACKENDS=${GATEWAY_HEALTH_BACKENDS:-sead-core,edge-service,storage,source-data}
      # Internal C++ services (gRPC-only, Go Gateway migration phase 4.4)
      - SVC_SEAD_CORE_GRPC=${SVC_SEAD_CORE_GRPC:-sead-core:50051}
      - SVC_EDGE_SERVICE_GRPC=${SVC_EDGE_SERVICE_GRPC:-edge-service:50055}
      - SVC_STORAGE_GRPC=${SVC_STORAGE_GRPC:-pin-service:50056}
      - SVC_SOURCE_DATA_GRPC=${SVC_SOURCE_DATA_GRPC:-source-data-service:50053}
      - GATEWAY_GRPC_PORT=${GATEWAY_GRPC_PORT:-50054}
      # Cross-node sync fetch (Phase 8): peer gateways this gateway fetches
      # missing events from over HTTPS. Comma-separated base URLs.
      - GATEWAY_PEERS=${GATEWAY_PEERS:-}
      - GATEWAY_PEER_TOKEN=${GATEWAY_PEER_TOKEN:-}
      # Peer gateway TLS: set GATEWAY_PEER_TLS_INSECURE=true only for
      # isolated/own-party deployments using self-signed certs; or set
      # GATEWAY_PEER_CA_CERT to a PEM CA bundle for a private CA.
      - GATEWAY_PEER_TLS_INSECURE=${GATEWAY_PEER_TLS_INSECURE:-false}
      - GATEWAY_PEER_CA_CERT=${GATEWAY_PEER_CA_CERT:-}
    # NOTE: edge-service is intentionally NOT a hard dependency here.
    # On a blank node edge-service fails-fast until an edge_authorization is
    # resolvable in sead-core, and enrollment (POST org-genesis /
    # edge-authorization) is served by the gateway -> sead-core path. Making the
    # gateway wait on edge-service would deadlock first-time enrollment.
    # edge-service is gRPC-only (no public port); it starts later via
    # `docker compose ... up -d edge-service` once enrollment is done. The
    # gateway's /health reports "degraded" until then — honest, not blocking.
    depends_on:
      sead-core:
        condition: service_healthy
      pin-service:
        condition: service_healthy
      source-data-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:30080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - sead-network

volumes:
  sead_data:

# edge-service's keys, each a host file holding the key as bare hex on one line
# (no `KEY=` prefix), owned by the operator at mode 0400. See the README,
# "Key files". Keep them outside ./secrets/, which the gateway mounts.
# With a file unreadable or empty, edge-service exits without its keys, since
# the inline key flags it would fall back to are no longer passed.
secrets:
  edge_signing_key:
    file: ${EDGE_SIGNING_KEY_FILE:?}
  org_signing_key:
    file: ${EDGE_ORG_SIGNING_KEY_FILE:?}
  org_public_key:
    file: ${EDGE_ORG_PUBLIC_KEY_FILE:?}

networks:
  sead-network:
    name: sead-network
    driver: bridge
