# Relay-only bootstrap peer — runs ONLY gossip-node as a pure libp2p transport
# relay. No sead-core, no edge-service, no gateway: this node is NOT enrolled
# to any org and requires NO XMSS signing key and NO dummy org.
#
# It is a connectivity anchor only: host + persistent identity (stable PeerId)
# + DHT + mDNS + bootstrap dialing. It subscribes to zero `sead-sync/{org}`
# topics, so it relays no org content and cannot inject into any DAG. Other
# nodes join the mesh by dialing its published libp2p multiaddr
# (`/ip4/<host-ip>/tcp/31002/p2p/<peerid>`).
#
# Usage: docker compose -f compose.relay.yaml up -d
# Get the PeerId: docker compose -f compose.relay.yaml logs gossip-node | grep "peer ID"
# Persistent identity keeps the PeerId stable across restarts.
#
# This file stands alone: it takes no overlay. Required variables use
# `${VAR:?}`: with one unset or empty, `docker compose` stops and names it.
#
# The project name is pinned to `stardome-sead`, the name Compose derived from
# the clone's directory before this file existed, so a running relay is
# recreated in place instead of left behind by a renamed project.

name: stardome-sead

services:
  gossip-node:
    image: ghcr.io/stardome-technology/stardome-sead/gossip-node:0.1.0@sha256:8d33f556a3d7ec29ce033b379650be86149eaf91a832087010de652395d39865
    container_name: stardome-relay
    # Publish the libp2p TCP port so other nodes reach this relay at the
    # node's LAN/mesh IP.
    ports:
      - "31002:31002/tcp"
    volumes:
      # Bind-mount the identity key DIRECTORY from the host, so the PeerId
      # survives restarts, recreates and `docker compose down -v` — the relay
      # PeerId is the bootstrap anchor other nodes hardcode in GOSSIP_BOOTSTRAP.
      # Mounting a directory (not a file) avoids Docker auto-creating the source
      # as a directory when the file doesn't exist yet; gossip-node creates
      # gossip-identity.key inside it on first start.
      #
      # GOSSIP_IDENTITY_DIR defaults to the absolute path
      # /var/lib/sead/gossip-keys, so every user who runs `docker compose`,
      # root under `sudo` included, mounts the same key. A path that changes
      # with the user, such as one under `~`, gives gossip-node an empty
      # directory, where it generates a NEW key: the relay PeerId changes and
      # every node that dials it fails with "peer id mismatch". To move an
      # existing key, see the README's section "Gossip identity key".
      - ${GOSSIP_IDENTITY_DIR:-/var/lib/sead/gossip-keys}:/data/gossip-keys
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SERVICE_NAME=gossip-relay
      # Deliberately NO GOSSIP_ORG_ID and NO GOSSIP_OBSERVE_ORGS: relay-only.
      - GOSSIP_LISTEN=${GOSSIP_LISTEN:-/ip4/0.0.0.0/tcp/31002}
      # Externally reachable multiaddr to advertise in place of the container-
      # internal host.Addrs() (e.g. the bat0 mesh IP). Set on the relay to
      # /ip4/192.168.60.4/tcp/31002 so peers redial a routable address
      # after a mesh flap. Required: the relay is the bootstrap anchor, and an
      # anchor that advertises its container IP is unreachable.
      - GOSSIP_ADVERTISE=${GOSSIP_ADVERTISE:?}
      - GOSSIP_BOOTSTRAP=${GOSSIP_BOOTSTRAP:-}
      - GOSSIP_MDNS=${GOSSIP_MDNS:-true}
      - GOSSIP_DHT=${GOSSIP_DHT:-true}
      - GOSSIP_PNET=${GOSSIP_PNET:-false}
      - GOSSIP_IDENTITY_KEY_FILE=${GOSSIP_IDENTITY_KEY_FILE:-/data/gossip-keys/gossip-identity.key}
    # Entrypoint override: see compose.yaml gossip-node. The image's
    # ENTRYPOINT is "gossip-node", so the `command` wrapper must run via sh -c.
    entrypoint: ["/bin/sh", "-c"]
    command: ["ARGS=\"--listen ${GOSSIP_LISTEN:-/ip4/0.0.0.0/tcp/31002} --mdns=${GOSSIP_MDNS:-true} --dht=${GOSSIP_DHT:-true} --identity-key-file ${GOSSIP_IDENTITY_KEY_FILE:-/data/gossip-keys/gossip-identity.key}\"; [ -n \"${GOSSIP_BOOTSTRAP:-}\" ] && ARGS=\"$$ARGS --bootstrap ${GOSSIP_BOOTSTRAP:-}\"; [ -n \"${GOSSIP_ADVERTISE:?}\" ] && ARGS=\"$$ARGS --advertise ${GOSSIP_ADVERTISE:?}\"; [ \"${GOSSIP_PNET:-false}\" = \"true\" ] && ARGS=\"$$ARGS --pnet\"; exec gossip-node $$ARGS"]
    restart: unless-stopped

networks:
  sead-network:
    name: sead-network
    driver: bridge
