name: Compose config

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose-config:
    name: Validate Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Show Docker Compose version
        run: docker compose version

      - name: Check the production pair and the relay file
        run: .github/scripts/check-compose-config.sh .env
